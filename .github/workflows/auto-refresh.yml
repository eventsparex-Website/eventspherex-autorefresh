name: Auto-Refresh News, Jobs & Tenders

on:
  schedule:
    # Run 3x/day: 6AM, 12PM, 6PM IST (12:30AM, 6:30AM, 12:30PM UTC)
    - cron: '30 0,6,12 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fetch live news
        run: node scripts/fetch-news.js

      - name: Fetch live jobs
        run: node scripts/fetch-jobs.js

      - name: Fetch live tenders
        run: node scripts/fetch-tenders.js

      - name: Build site with Eleventy
        run: npx @11ty/eleventy

      - name: Build search index
        run: npx pagefind --site _site

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 65002 157.173.216.223 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Hostinger (news/jobs/tenders only - preserves manual content)
        run: |
          rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes" \
            _site/industry-news/ u410945448@157.173.216.223:~/domains/eventspherex.com/public_html/industry-news/ \
            --delete
          rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes" \
            _site/tenders/ u410945448@157.173.216.223:~/domains/eventspherex.com/public_html/tenders/ \
            --delete
          rsync -avz -e "ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o BatchMode=yes" \
            _site/tools/job-board.html u410945448@157.173.216.223:~/domains/eventspherex.com/public_html/tools/job-board.html

      - name: Keepalive commit (prevents 60-day auto-disable)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit --allow-empty -m "keepalive: scheduled refresh"
          git push
